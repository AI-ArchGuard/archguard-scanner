name: Scanner Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Checkout accepted S7 samples
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AI-ArchGuard/archguard-samples
          ref: 7b93248bf67619a6b26c1d428bcf92d1fe3a781b
          path: s7-samples
      - name: Verify release candidate
        run: |
          chmod +x ./mvnw
          ./mvnw --batch-mode --no-transfer-progress verify
          python3 s7-samples/scripts/verify_samples.py s7-samples
          mkdir -p target
          cp -R s7-samples target/platform-samples
          python3 -c 'import json, pathlib; path = pathlib.Path("target/platform-samples/samples.json"); data = json.loads(path.read_text()); data["scannerVersion"] = "0.2.1"; path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n")'
          python3 s7-samples/scripts/verify_with_scanner.py \
            --jar scanner-cli/target/archguard-scanner.jar \
            --samples target/platform-samples \
            --results target/s7-results.json
          sha256sum scanner-cli/target/archguard-scanner.jar > scanner-cli/target/archguard-scanner.jar.sha256
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            scanner-cli/target/archguard-scanner.jar \
            scanner-cli/target/archguard-scanner.jar.sha256 \
            --verify-tag \
            --title "ArchGuard Scanner $GITHUB_REF_NAME" \
            --generate-notes
