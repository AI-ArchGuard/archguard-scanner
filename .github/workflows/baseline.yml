name: Repository Baseline

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail
          for file in README.md LICENSE AGENTS.md CONTRIBUTING.md SECURITY.md CHANGELOG.md .editorconfig .gitignore .github/pull_request_template.md .github/ISSUE_TEMPLATE/feature.yml .github/ISSUE_TEMPLATE/bug.yml; do
            test -f "$file"
          done
          echo "c71d239df91726fc519c6eb72d318ec65820627232b2f796219e87dcf35d0ab4  LICENSE" | sha256sum --check --strict
      - name: Check whitespace errors
        shell: bash
        run: |
          baseline_empty_tree="$(git hash-object -t tree /dev/null)"
          git diff --check "$baseline_empty_tree" HEAD

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify Scanner
        run: |
          chmod +x ./mvnw
          ./mvnw --batch-mode --no-transfer-progress verify
      - name: Checkout accepted S7 samples
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AI-ArchGuard/archguard-samples
          ref: 7b93248bf67619a6b26c1d428bcf92d1fe3a781b
          path: s7-samples
      - name: Verify golden samples, repeatability, and performance bounds
        run: |
          python3 s7-samples/scripts/verify_samples.py s7-samples
          mkdir -p target
          cp -R s7-samples target/platform-samples
          python3 -c 'import json, pathlib; path = pathlib.Path("target/platform-samples/samples.json"); data = json.loads(path.read_text()); data["scannerVersion"] = "0.2.1"; path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n")'
          python3 s7-samples/scripts/verify_with_scanner.py \
            --jar scanner-cli/target/archguard-scanner.jar \
            --samples target/platform-samples \
            --results target/s7-results.json
          cat target/s7-results.json
